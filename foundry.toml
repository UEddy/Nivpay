# The product profile. Everything about NivPayPots builds, tests and deploys
# under Monad's own execution rules.
#
# network = "monad" makes Forge use Monad's gas model, opcode pricing,
# transaction rules, precompiles and contract size limits for compilation,
# testing, scripts and transaction simulation. It needs Foundry v1.8.0 or
# later. Without it the whole suite runs under Ethereum rules, which is not
# the chain this is going to.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
network = "monad"

solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

# Monad's block gas limit. The retired streaming benchmark deliberately
# exceeds it, so it is excluded here and runs under its own profile instead.
# See [profile.bench] below.
gas_limit = 150000000
block_gas_limit = 150000000
no_match_path = "test/StreamBench.t.sol"

# Needed so the retired benchmark's gas sweep can emit bench/gas.json.
fs_permissions = [{ access = "read-write", path = "./bench" }]

# The retired streaming benchmark, kept as evidence of process and kept
# passing. Its N = 10000 measurements deliberately exceed Monad's block gas
# limit, which is part of what it set out to show, so under Monad rules the
# sweep fails with MemoryLimitOOG. It therefore keeps the Ethereum rules and
# the enormous gas ceiling it was always measured under. Nothing about the
# product is weakened to accommodate it: it is simply a different profile.
#
#     $env:FOUNDRY_PROFILE = "bench"; forge test
#
# The no_match_path here only exists to cancel the exclusion inherited from
# the default profile. It names a file that does not exist, so nothing is
# excluded and match_path alone decides what runs.
[profile.bench]
network = "ethereum"
no_match_path = "test/_nothing_is_excluded_here_.sol"
match_path = "test/StreamBench.t.sol"
gas_limit = "18446744073709551615"
block_gas_limit = "18446744073709551615"

# Deployment. Separate from the default profile so a real broadcast can never
# inherit a test setting by accident.
#
# Monad charges the gas limit a transaction declares, not the gas it used, so
# Forge's default 130 percent estimate multiplier would be paid in full rather
# than refunded. There is no foundry.toml key for it: pass
# -g 105 (--gas-estimate-multiplier) on the forge script command line. The
# README's deployment commands do exactly that.
[profile.deploy]
network = "monad"
gas_limit = 30000000
block_gas_limit = 150000000
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512
max_test_rejects = 200000

# The thorough setting, and deliberately the default: a plain `forge test` is
# the one to run before a deploy. 256 runs at depth 96 is about 24,576 calls per
# invariant and takes several minutes.
[invariant]
runs = 256
depth = 96
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

# Everyday work. Same contract, same Monad rules, same invariants and the same
# depth per run, just fewer runs, which turns the invariant suite from minutes
# into well under one.
#
#     $env:FOUNDRY_PROFILE = "quick"; forge test
#
# It is a narrower search, not a weaker one, and it is NOT sufficient before a
# deploy. The thorough setting stays on the default profile on purpose, so
# under-testing has to be asked for rather than happening by forgetting.
[profile.quick.invariant]
runs = 24

[rpc_endpoints]
# Public Monad testnet RPC from docs.monad.xyz. Override with the env var to
# point the fork tests at your own endpoint.
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad_testnet_public = "https://testnet-rpc.monad.xyz"

[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", chain = 10143, url = "https://sourcify-api-monad.blockvision.org/" }

[fmt]
line_length = 120
tab_width = 4

