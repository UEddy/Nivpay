[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pinned so the benchmark is reproducible. Gas numbers are meaningless without
# a fixed compiler, optimizer setting and EVM target.
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# The N = 10000 measurements in the retired streaming benchmark deliberately
# exceed the Monad block gas limit of 150,000,000. The harness needs headroom
# to measure them anyway, so that the report can state how far past the limit
# they land rather than just failing.
gas_limit = "18446744073709551615"
block_gas_limit = "18446744073709551615"

# Needed so the gas sweep can emit bench/gas.json for the cost model script.
fs_permissions = [{ access = "read-write", path = "./bench" }]

# Deployment profile. The default profile carries the retired benchmark's
# enormous gas_limit, which must never reach a real broadcast, so deployment
# runs under its own profile with ordinary settings.
#
# Monad charges the gas limit a transaction declares, not the gas it actually
# used. Forge's default estimate multiplier of 130 percent would therefore be
# paid in full on every transaction rather than refunded. 105 percent keeps a
# little headroom for estimation drift without paying for headroom that is
# never used.
[profile.deploy]
gas_limit = 30000000
block_gas_limit = 150000000
gas_estimate_multiplier = 105
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512
max_test_rejects = 200000

[invariant]
runs = 256
depth = 96
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

[rpc_endpoints]
# Public Monad testnet RPC from docs.monad.xyz. Override with the env var to
# point the fork tests at your own endpoint.
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad_testnet_public = "https://testnet-rpc.monad.xyz"

[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", chain = 10143, url = "https://sourcify-api-monad.blockvision.org/" }

[fmt]
line_length = 120
tab_width = 4
