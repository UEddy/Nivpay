[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pinned so the benchmark is reproducible. Gas numbers are meaningless without
# a fixed compiler, optimizer setting and EVM target.
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# The N = 10000 measurements deliberately exceed the Monad block gas limit of
# 150,000,000. The harness needs headroom to measure them anyway, so that the
# report can state how far past the limit they land rather than just failing.
gas_limit = "18446744073709551615"
block_gas_limit = "18446744073709551615"

# Needed so the gas sweep can emit bench/gas.json for the cost model script.
fs_permissions = [{ access = "read-write", path = "./bench" }]

[fmt]
line_length = 120
tab_width = 4
