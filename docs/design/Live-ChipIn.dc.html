<script type="text/x-dc" data-dc-script data-props='{"autoplay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timers = [];
    this.rafs = {};
    this.alive = true;
    if (this.props.autoplay ?? true) this.at(1900, () => this.pour());
  }
  componentWillUnmount() {
    this.alive = false;
    (this.timers || []).forEach((t) => clearTimeout(t));
    Object.keys(this.rafs || {}).forEach((k) => cancelAnimationFrame(this.rafs[k]));
  }
  at(ms, fn) {
    this.timers.push(setTimeout(() => { if (this.alive) fn(); }, ms));
  }
  tween(key, from, to, dur) {
    let t0 = null;
    const step = (now) => {
      if (!this.alive) return;
      if (t0 === null) t0 = now;
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      const o = {};
      o[key] = from + (to - from) * e;
      o[key + 'Live'] = p < 1;
      this.setState(o);
      if (p < 1) this.rafs[key] = requestAnimationFrame(step);
    };
    this.rafs[key] = requestAnimationFrame(step);
  }
  money(v, live) {
    const exact = Math.abs(v - Math.round(v)) < 0.005;
    const n = live || exact ? Math.round(v) : v;
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: live || exact ? 0 : 2, maximumFractionDigits: live || exact ? 0 : 2 });
  }
  pour() {
    const s = this.state || {};
    if (s.phase) return;
    this.setState({ phase: 1 });
    this.at(700, () => this.setState({ phase: 2 }));
    this.at(1600, () => { this.setState({ phase: 3 }); this.tween('pot', 500, 900, 750); });
    this.at(2550, () => this.setState({ phase: 4 }));
  }
  renderVals() {
    const s = this.state || {};
    const ph = s.phase || 0;
    const travel = 'stroke-dashoffset 900ms cubic-bezier(0.65,0,0.35,1)';
    const grow = 'transform 750ms cubic-bezier(0.34,1.35,0.64,1)';
    return {
      pour: () => this.pour(),
      routeO: ph >= 2 ? 0 : 1,
      trail: ph >= 2 ? '0px' : '112px',
      coin: ph >= 2 ? '-118px' : '6px',
      travelT: ph >= 2 ? travel : 'none',
      plusO: ph >= 3 ? 0 : 1,
      layerU: ph >= 3 ? 1 : 0,
      waveY: ph >= 3 ? '70.8px' : '122px',
      waveC: ph >= 3 ? '#245C5A' : '#A5451F',
      growT: ph >= 3 ? grow : 'none',
      slosh: ph >= 3 ? 'lvSlosh 900ms ease-out 1 both' : 'none',
      ringDash: ph >= 3 ? 'none' : '3px 3px',
      pingO: ph >= 3 ? 0 : 1,
      ping: ph >= 3 ? 'none' : 'lvPing 1.8s cubic-bezier(0,0,0.2,1) infinite',
      checkO: ph >= 3 ? 1 : 0,
      checkS: ph >= 3 ? 1 : 0.2,
      potText: this.money(s.pot ?? 500, !!s.potLive),
      btnLabel: ph === 1 ? 'Confirm with your fingerprint' : ph >= 2 ? 'Pouring in…' : 'Pour in $400',
      btnBg: ph >= 1 ? '#7F3316' : '#A5451F',
      fp: ph === 1 ? 'lvBreathe 700ms ease-in-out infinite' : 'none',
      done: ph >= 4,
      notDone: ph < 4
    };
  }
}
</script>
