<script type="text/x-dc" data-dc-script data-props='{"autoplay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timers = [];
    this.rafs = {};
    this.alive = true;
    if (this.props.autoplay ?? true) {
      this.setState(this.startState());
      this.at(700, () => this.play());
    } else {
      this.setState(this.endState());
    }
  }
  componentWillUnmount() {
    this.alive = false;
    this.stopAll();
  }
  at(ms, fn) {
    this.timers.push(setTimeout(() => { if (this.alive) fn(); }, ms));
  }
  stopAll() {
    (this.timers || []).forEach((t) => clearTimeout(t));
    this.timers = [];
    Object.keys(this.rafs || {}).forEach((k) => cancelAnimationFrame(this.rafs[k]));
    this.rafs = {};
  }
  tween(key, from, to, dur) {
    let t0 = null;
    if (this.rafs[key]) cancelAnimationFrame(this.rafs[key]);
    const step = (now) => {
      if (!this.alive) return;
      if (t0 === null) t0 = now;
      const p = Math.min(1, (now - t0) / dur);
      const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      const o = {};
      o[key] = from + (to - from) * e;
      o[key + 'Live'] = p < 1;
      this.setState(o);
      if (p < 1) this.rafs[key] = requestAnimationFrame(step);
    };
    this.rafs[key] = requestAnimationFrame(step);
  }
  money(v, live) {
    const exact = Math.abs(v - Math.round(v)) < 0.005;
    const whole = live || exact;
    const n = whole ? Math.round(v) : v;
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 });
  }
  startState() {
    return { running: false, date: '28 Sep', goL: false, goH: false, goU: false, inL: false, inH: false, inU: false, tilt: false, goC: false, goE: false, level: 1, paidC: false, paidE: false, rows: 0, pot: 0, potLive: false };
  }
  endState() {
    return { running: false, date: '', goL: true, goH: true, goU: true, inL: true, inH: true, inU: true, tilt: false, goC: true, goE: true, level: 0.1156, paidC: true, paidE: true, rows: 5, pot: 115.6, potLive: false };
  }
  replay() {
    this.stopAll();
    this.setState(this.startState());
    this.at(120, () => this.play());
  }
  play() {
    this.setState({ running: true, date: '28 Sep' });
    this.at(200, () => this.setState({ goL: true }));
    this.at(1000, () => { this.setState({ inL: true, rows: 1 }); this.tween('pot', 0, 500, 550); });
    this.at(1300, () => this.setState({ goH: true }));
    this.at(2100, () => { this.setState({ inH: true, rows: 2 }); this.tween('pot', 500, 900, 550); });
    this.at(2400, () => this.setState({ goU: true, date: '29 Sep' }));
    this.at(3200, () => { this.setState({ inU: true, rows: 3 }); this.tween('pot', 900, 1000, 450); });
    this.at(3600, () => this.setState({ date: '14 Oct', tilt: true }));
    this.at(3850, () => { this.setState({ goC: true, level: 0.397 }); this.tween('pot', 1000, 397, 950); });
    this.at(4700, () => this.setState({ paidC: true, rows: 4 }));
    this.at(4850, () => this.setState({ tilt: false }));
    this.at(5250, () => this.setState({ date: '20 Nov', tilt: true }));
    this.at(5500, () => { this.setState({ goE: true, level: 0.1156 }); this.tween('pot', 397, 115.6, 950); });
    this.at(6350, () => this.setState({ paidE: true, rows: 5 }));
    this.at(6500, () => this.setState({ tilt: false }));
    this.at(7000, () => this.setState({ running: false, date: '' }));
  }
  renderVals() {
    const s = this.state || {};
    const run = !!s.running;
    const move = (on) => (run && on ? 'stroke-dashoffset 800ms cubic-bezier(0.65,0,0.35,1)' : 'none');
    const grow = run ? 'transform 550ms cubic-bezier(0.34,1.35,0.64,1)' : 'none';
    const top = s.inU ? 58 : s.inH ? 70.8 : s.inL ? 122 : 186.5;
    const rows = s.rows || 0;
    const shown = (k) => (rows >= k ? 'opacity:1;transform:none;' : 'opacity:0.22;transform:translateX(-6px);') + (run ? 'transition:opacity 380ms ease-out, transform 380ms ease-out' : 'transition:none');
    const ink = '#3A2317';
    return {
      replay: () => this.replay(),
      tL: s.goL ? '0px' : '77px', cL: s.goL ? '-83px' : '6px', mL: move(s.goL),
      tH: s.goH ? '0px' : '112px', cH: s.goH ? '-118px' : '6px', mH: move(s.goH),
      tU: s.goU ? '0px' : '63px', cU: s.goU ? '-69px' : '6px', mU: move(s.goU),
      tC: s.goC ? '0px' : '97px', cC: s.goC ? '-103px' : '6px', mC: move(s.goC),
      tE: s.goE ? '0px' : '98px', cE: s.goE ? '-104px' : '6px', mE: move(s.goE),
      tilt: s.tilt ? '12deg' : '0deg',
      level: s.level ?? 1,
      levelT: run ? 'transform 950ms cubic-bezier(0.65,0,0.35,1)' : 'none',
      sI: s.inL ? 1 : 0, sU: s.inH ? 1 : 0, sA: s.inU ? 1 : 0,
      growT: grow,
      waveY: top + 'px',
      waveO: s.inL ? 1 : 0,
      waveC: s.inU ? '#D99A2B' : s.inH ? '#245C5A' : '#A5451F',
      ringL: s.inL ? '#A5451F' : '#C9AD8C', dashL: s.inL ? 'none' : '3px 3px',
      ringH: s.inH ? '#245C5A' : '#C9AD8C', dashH: s.inH ? 'none' : '3px 3px',
      ringU: s.inU ? '#B07A1E' : '#C9AD8C', dashU: s.inU ? 'none' : '3px 3px',
      cFill: s.paidC ? ink : '#FFFBF5', cIcon: s.paidC ? '#FAF1E4' : ink, cSub: s.paidC ? '$600 of $700' : 'up to $700',
      eFill: s.paidE ? ink : '#FFFBF5', eIcon: s.paidE ? '#FAF1E4' : ink, eSub: s.paidE ? '$280 of $300' : 'up to $300',
      potText: this.money(s.pot ?? 0, !!s.potLive),
      badge: s.date ? 'Replay · ' + s.date : 'Live',
      dot: s.date ? '#6E5243' : '#A5451F',
      dotPing: s.date ? 'none' : 'lvPing 1.8s cubic-bezier(0,0,0.2,1) infinite',
      events: [
        { title: 'Poured $280.00 to the Event hall', sub: 'Aniekan asked, you approved · fee $1.40', date: '20 Nov', ring: ink, fill: '#FAF1E4', style: shown(5) },
        { title: 'Poured $600.00 to the Caterer', sub: 'Aniekan asked, Ubong approved · fee $3.00', date: '14 Oct', ring: ink, fill: '#FAF1E4', style: shown(4) },
        { title: 'Aniekan added $100.00', sub: 'From Uyo · all three are in', date: '29 Sep', ring: '#D99A2B', fill: '#D99A2B', style: shown(3) },
        { title: 'Ubong added $400.00', sub: 'From Houston', date: '28 Sep', ring: '#245C5A', fill: '#245C5A', style: shown(2) },
        { title: 'You added $500.00', sub: 'From London · you made the pot', date: '28 Sep', ring: '#A5451F', fill: '#A5451F', style: shown(1) }
      ]
    };
  }
}
</script>
