<script type="text/x-dc" data-dc-script data-props='{"autoplay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timers = [];
    this.alive = true;
    if (this.props.autoplay ?? true) this.at(2300, () => this.make());
  }
  componentWillUnmount() {
    this.alive = false;
    (this.timers || []).forEach((t) => clearTimeout(t));
  }
  at(ms, fn) {
    this.timers.push(setTimeout(() => { if (this.alive) fn(); }, ms));
  }
  make() {
    const s = this.state || {};
    if (s.made) return;
    this.setState({ made: true });
    this.at(380, () => this.setState({ inv: true }));
    this.at(1380, () => this.setState({ arrived: true }));
    this.at(1800, () => this.setState({ done: true }));
  }
  renderVals() {
    const s = this.state || {};
    const made = !!s.made;
    const inv = !!s.inv;
    const arrived = !!s.arrived;
    const done = !!s.done;
    const travel = 'stroke-dashoffset 900ms cubic-bezier(0.65,0,0.35,1)';
    return {
      make: () => this.make(),
      phO: made ? 0 : 1,
      routeO: made ? 1 : 0,
      lidY: made ? '3px' : '0px',
      lockO: made ? 1 : 0,
      lockS: made ? 1 : 0.2,
      coinH: inv ? '-118px' : '6px',
      coinHT: inv ? travel : 'none',
      coinU: inv ? '-69px' : '6px',
      coinUT: inv ? travel + ' 140ms' : 'none',
      ringH: arrived ? '#245C5A' : '#C9AD8C',
      ringU: arrived ? '#B07A1E' : '#C9AD8C',
      pingO: arrived ? 1 : 0,
      ping: arrived ? 'lvPing 2.4s cubic-bezier(0,0,0.2,1) infinite' : 'none',
      hSub: arrived ? 'Ubong · invited' : 'Ubong',
      uSub: arrived ? 'Aniekan · invited' : 'Aniekan',
      badge: made ? 'Live' : 'Draft',
      dot: made ? '#A5451F' : '#C9AD8C',
      dotPing: made ? 'lvPing 1.8s cubic-bezier(0,0,0.2,1) infinite' : 'none',
      lockText: made ? 'Locked. Nobody can change where it pours, not even you.' : 'Once it’s made, nobody can change where it pours. Not even you.',
      lockBg: made ? '#F3DFC6' : 'rgba(243,223,198,0)',
      btnLabel: made ? 'Locking the rules…' : 'Make the pot',
      btnBg: made ? '#7F3316' : '#A5451F',
      done: done,
      notDone: !done
    };
  }
}
</script>
